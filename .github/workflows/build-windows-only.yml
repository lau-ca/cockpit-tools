name: Build Windows Only

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/build-windows-run"

concurrency:
  group: build-windows-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install frontend dependencies
        run: npm install

      - name: Sync versions
        run: npm run sync-version

      - name: Check locales
        run: node scripts/check_locales.cjs

      - name: Typecheck
        run: npm run typecheck

  build-windows:
    name: Build (windows-latest)
    needs: preflight
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install frontend dependencies
        run: npm install

      - name: Sync versions
        run: npm run sync-version

      - name: Disable updater signing for unsigned CI builds
        if: env.TAURI_SIGNING_PRIVATE_KEY == '' || env.TAURI_SIGNING_PRIVATE_KEY == 'undefined'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require('fs');
          const path = 'src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));

          if (config.bundle) {
            config.bundle.createUpdaterArtifacts = false;
          }

          if (config.plugins && config.plugins.updater) {
            delete config.plugins.updater;
          }

          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          console.log('Disabled updater signing config for unsigned CI build.');
          EOF

      - name: Build app
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" || "$TAURI_SIGNING_PRIVATE_KEY" == "undefined" ]]; then
            unset TAURI_SIGNING_PRIVATE_KEY
            unset TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          npx tauri build --ci 2>&1 | tee "build-windows-latest.log"

      - name: Summarize warnings
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          log_file="build-windows-latest.log"
          warnings_file="warnings-windows-latest.txt"
          if grep -n "^warning:" "$log_file" > "$warnings_file"; then
            warning_count="$(wc -l < "$warnings_file" | tr -d ' ')"
          else
            : > "$warnings_file"
            warning_count="0"
          fi

          {
            echo "## windows-latest"
            echo
            echo "- warnings: ${warning_count}"
            echo "- log: build-windows-latest.log"
            if [ -s "$warnings_file" ]; then
              echo
              echo '```text'
              sed -n '1,200p' "$warnings_file"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-windows-latest
          retention-days: 7
          if-no-files-found: error
          path: |
            build-windows-latest.log
            warnings-windows-latest.txt

      - name: Upload bundles
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bundles-windows-latest
          retention-days: 7
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle
